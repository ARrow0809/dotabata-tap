name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble wasm and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html index.js index.audio.worklet.js index.audio.position.worklet.js index.png index.pck public/
          cat index.wasm.part-aa index.wasm.part-ab > public/index.wasm
          cd public
          sha256sum -c ../checksums.txt
          touch .nojekyll
          ls -la
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
